    const c=chips();plist.forEach(n=>{const k=n.split(" ")[0];c.appendChild(chip(n,propColor(k),U.prop===k,()=>{U.prop=k;U.layer="prop";if(U.tool==="fill"||U.tool==="pan"||U.tool==="select")U.tool="brush";renderUI()}))});
  }else if(U.tab==="mark"){
    hint("Znaczniki: punkty dla mnie (start, ognisko, kupiec, NPC, wrogowie). Wpisz nazwę, żeby było jasne, co to jest.");
    const r=document.createElement("label");r.className="row";r.innerHTML='Nazwa <input id="ml" style="flex:1;min-width:120px" placeholder="np. Marga, kowal, wejście do krypty">';add(r);$("#ml").value=U.label;$("#ml").oninput=e=>U.label=e.target.value;
    const c=chips();MARKS.forEach(m=>c.appendChild(chip(m[1],m[3],U.mark===m[0],()=>{U.mark=m[0];U.layer="mark";if(U.tool==="fill"||U.tool==="pan"||U.tool==="select")U.tool="brush";renderUI()})));
  }else{
    hint("Eksport daje tekst, który wklejasz do czatu. Import wczytuje taki tekst z powrotem.");
    const g=document.createElement("div");g.className="chips";add(g);
    [["Wczytaj mapę z gry",loadPreset],["Eksport (kopiuj)",doExport],["Import (wklej)",doImport],["Wyczyść mapę",doClear]].forEach(([n,f])=>{const b=document.createElement("button");b.textContent=n;b.onclick=f;g.appendChild(b)});
    const n=document.createElement("div");n.innerHTML='<p class="hint">Opis dla mnie (co ma być w tym miejscu, klimat, uwagi):</p><textarea id="note"></textarea>';add(n);$("#note").value=D.note;$("#note").oninput=e=>{D.note=e.target.value;save()};
    const bg=document.createElement("div");bg.innerHTML='<p class="hint">Podkład (szkic lub zrzut ekranu pod siatką):</p><input type="file" id="bgf" accept="image/*"> <label class="row">Przezroczystość <input id="bga" type="range" min="0" max="100" value="'+Math.round(U.bgA*100)+'"></label> <button id="bgx">Usuń podkład</button>';add(bg);
    $("#bgf").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{U.bg=im;draw();toast("Podkład wczytany")};im.src=URL.createObjectURL(f)};
    $("#bga").oninput=e=>{U.bgA=e.target.value/100;draw()};$("#bgx").onclick=()=>{U.bg=null;draw()};
    const gg=document.createElement("label");gg.className="row";gg.innerHTML='<input type="checkbox" id="grid" '+(U.showGrid?"checked":"")+'> Siatka';add(gg);$("#grid").onchange=e=>{U.showGrid=e.target.checked;draw()};
  }
  if(U.sel){
    const it=U.sel.kind==="prop"?D.props[U.sel.i]:D.marks[U.sel.i];
    if(it){const d=document.createElement("div");d.className="chips";
      const t=document.createElement("p");t.className="hint";t.textContent="Zaznaczone: "+(U.sel.kind==="prop"?it.k+" ("+it.w+"×"+it.h+")":MK[it.t][1]+(it.label?" – "+it.label:""))+" na polu "+it.x+","+it.y;
      d.appendChild(t);const b=document.createElement("button");b.textContent="Usuń zaznaczone";b.onclick=()=>{push();(U.sel.kind==="prop"?D.props:D.marks).splice(U.sel.i,1);U.sel=null;afterDoc()};d.appendChild(b);
      if(U.sel.kind==="mark"){const l=document.createElement("input");l.placeholder="nazwa";l.value=it.label||"";l.oninput=e=>{it.label=e.target.value;draw();save()};d.appendChild(l)}
      if(U.sel.kind==="prop"){const l=document.createElement("input");l.placeholder="uwaga (np. obrócony, duży)";l.value=it.note||"";l.oninput=e=>{it.note=e.target.value;save()};d.appendChild(l)}
      p.appendChild(d)}
  }
}
function propColor(k){let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))>>>0;return "hsl("+(h%360)+",45%,48%)"}

// ---- rysowanie ----
const cv=$("#cv"),cx=cv.getContext("2d");let dpr=1;
function resizeCv(){const r=cv.parentElement.getBoundingClientRect();dpr=window.devicePixelRatio||1;cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);draw()}
function draw(){
  const z=U.z;cx.setTransform(dpr,0,0,dpr,0,0);cx.clearRect(0,0,cv.width,cv.height);
  const fl=FLOORS[D.ch];
  for(let y=0;y<D.h;y++)for(let x=0;x<D.w;x++){const i=y*D.w+x;cx.fillStyle=fl[D.floor[i]]?fl[D.floor[i]][1]:"#444";cx.fillRect(U.ox+x*z,U.oy+y*z,z+.5,z+.5)}
  if(U.bg){cx.globalAlpha=U.bgA;cx.drawImage(U.bg,U.ox,U.oy,D.w*z,D.h*z);cx.globalAlpha=1}
  for(let y=0;y<D.h;y++)for(let x=0;x<D.w;x++){const b=D.block[y*D.w+x];if(!b)continue;const def=BLOCKS.find(q=>q[0]===BKEY[b-1]);cx.globalAlpha=BKEY[b-1]==="road"?.55:.92;cx.fillStyle=def[2];cx.fillRect(U.ox+x*z,U.oy+y*z,z+.5,z+.5);cx.globalAlpha=1}
  if(U.showGrid&&z>=8){cx.strokeStyle="rgba(255,255,255,.12)";cx.lineWidth=1;cx.beginPath();for(let x=0;x<=D.w;x++){cx.moveTo(U.ox+x*z+.5,U.oy);cx.lineTo(U.ox+x*z+.5,U.oy+D.h*z)}for(let y=0;y<=D.h;y++){cx.moveTo(U.ox,U.oy+y*z+.5);cx.lineTo(U.ox+D.w*z,U.oy+y*z+.5)}cx.stroke();
    cx.strokeStyle="rgba(255,255,255,.28)";cx.beginPath();for(let x=0;x<=D.w;x+=8){cx.moveTo(U.ox+x*z+.5,U.oy);cx.lineTo(U.ox+x*z+.5,U.oy+D.h*z)}for(let y=0;y<=D.h;y+=8){cx.moveTo(U.ox,U.oy+y*z+.5);cx.lineTo(U.ox+D.w*z,U.oy+y*z+.5)}cx.stroke()}
  cx.strokeStyle="#fff";cx.lineWidth=2;cx.strokeRect(U.ox,U.oy,D.w*z,D.h*z);
  cx.font="600 "+Math.max(8,Math.min(12,z*.8))+"px Barlow,sans-serif";cx.textAlign="center";cx.textBaseline="middle";
  D.props.forEach((p,i)=>{const x=U.ox+p.x*z,y=U.oy+p.y*z,w=p.w*z,h=p.h*z;cx.fillStyle=propColor(p.k);cx.globalAlpha=.9;cx.fillRect(x+1,y+1,w-2,h-2);cx.globalAlpha=1;cx.strokeStyle=p.solid?"#fff":"rgba(255,255,255,.4)";cx.lineWidth=p.solid?2:1;if(!p.solid)cx.setLineDash([3,3]);cx.strokeRect(x+1,y+1,w-2,h-2);cx.setLineDash([]);
    if(z>=9){cx.fillStyle="#fff";cx.save();cx.beginPath();cx.rect(x,y,w,h);cx.clip();cx.fillText(p.k.replace(/^cz_/,"").slice(0,Math.max(2,Math.floor(w/(z*.5)))),x+w/2,y+h/2);cx.restore()}
    if(U.sel&&U.sel.kind==="prop"&&U.sel.i===i){cx.strokeStyle="#ffe14a";cx.lineWidth=3;cx.strokeRect(x-1,y-1,w+2,h+2)}});
  D.marks.forEach((m,i)=>{const d=MK[m.t],x=U.ox+(m.x+.5)*z,y=U.oy+(m.y+.5)*z,r=Math.max(6,z*.45);cx.fillStyle=d[3];cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();cx.strokeStyle="#000";cx.lineWidth=1.5;cx.stroke();cx.fillStyle="#000";cx.font="700 "+Math.max(9,r*1.1)+"px Barlow,sans-serif";cx.fillText(d[2],x,y+.5);
    if(m.label&&z>=9){cx.font="600 11px Barlow,sans-serif";const tw=cx.measureText(m.label).width;cx.fillStyle="rgba(0,0,0,.7)";cx.fillRect(x-tw/2-3,y+r+2,tw+6,14);cx.fillStyle="#fff";cx.fillText(m.label,x,y+r+9)}
    if(U.sel&&U.sel.kind==="mark"&&U.sel.i===i){cx.strokeStyle="#ffe14a";cx.lineWidth=3;cx.beginPath();cx.arc(x,y,r+3,0,7);cx.stroke()}});
  if(drag&&drag.rect){const a=drag.rect;const x0=Math.min(a.x0,a.x1),y0=Math.min(a.y0,a.y1),x1=Math.max(a.x0,a.x1),y1=Math.max(a.y0,a.y1);cx.strokeStyle="#ffe14a";cx.lineWidth=2;cx.strokeRect(U.ox+x0*z,U.oy+y0*z,(x1-x0+1)*z,(y1-y0+1)*z)}
}
function afterDoc(){renderUI();draw();save()}

// ---- obsługa wskaźnika ----
function showTip(c,e){const el=$("#tip");let name="",sub="";const h=c.in?hit(c):null;
  if(h){const it=h.kind==="prop"?D.props[h.i]:D.marks[h.i];if(h.kind==="prop"){name=it.k;sub="rekwizyt "+it.w+"×"+it.h+(it.solid?", blokuje przejście":", bez kolizji")+(it.note?" · "+it.note:"")}else{name=(it.label||MK[it.t][1]);sub="znacznik: "+MK[it.t][1]}}
  else if(c.in){const b=D.block[c.y*D.w+c.x];if(b){const def=BLOCKS.find(q=>q[0]===BKEY[b-1]);name=def[1];sub="blok"}}
  if(!name){el.classList.remove("show");return}
  el.innerHTML="<b></b><small></small>";el.firstChild.textContent=name;el.lastChild.textContent=sub+" · pole "+c.x+","+c.y;
  const r=cv.getBoundingClientRect();let x=e.clientX-r.left+14,y=e.clientY-r.top+14;el.style.left="0px";el.style.top="0px";el.classList.add("show");
  const w=el.offsetWidth,hh=el.offsetHeight;x=Math.max(4,Math.min(r.width-w-4,x));y=y+hh>r.height-4?Math.max(4,e.clientY-r.top-hh-14):y;el.style.left=x+"px";el.style.top=y+"px";
  clearTimeout(showTip.t);showTip.t=setTimeout(()=>el.classList.remove("show"),3500)}
let drag=null;const pts=new Map();let pinch=null;
function cell(e){const r=cv.getBoundingClientRect();const x=Math.floor((e.clientX-r.left-U.ox)/U.z),y=Math.floor((e.clientY-r.top-U.oy)/U.z);return{x,y,in:x>=0&&y>=0&&x<D.w&&y<D.h}}
function hit(c){for(let i=D.marks.length-1;i>=0;i--){const m=D.marks[i];if(m.x===c.x&&m.y===c.y)return{kind:"mark",i}}for(let i=D.props.length-1;i>=0;i--){const p=D.props[i];if(c.x>=p.x&&c.x<p.x+p.w&&c.y>=p.y&&c.y<p.y+p.h)return{kind:"prop",i}}return null}
function setCell(c){if(!c.in)return;const i=c.y*D.w+c.x;
  if(U.tool==="erase"){if(U.layer==="floor")D.floor[i]=0;else if(U.layer==="block")D.block[i]=0;else{const h=hit(c);if(h&&h.kind===U.layer)(h.kind==="prop"?D.props:D.marks).splice(h.i,1)}return}
  if(U.layer==="floor")D.floor[i]=U.floor;
  else if(U.layer==="block")D.block[i]=U.block?BKEY.indexOf(U.block)+1:0}
function fillRect(a){const x0=Math.max(0,Math.min(a.x0,a.x1)),y0=Math.max(0,Math.min(a.y0,a.y1)),x1=Math.min(D.w-1,Math.max(a.x0,a.x1)),y1=Math.min(D.h-1,Math.max(a.y0,a.y1));for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)setCell({x,y,in:true})}
function flood(c){if(!c.in||(U.layer!=="floor"&&U.layer!=="block"))return;const arr=U.layer==="floor"?D.floor:D.block;const t=arr[c.y*D.w+c.x];const v=U.layer==="floor"?U.floor:(U.block?BKEY.indexOf(U.block)+1:0);if(t===v)return;const st=[[c.x,c.y]];while(st.length){const[x,y]=st.pop();if(x<0||y<0||x>=D.w||y>=D.h)continue;const i=y*D.w+x;if(arr[i]!==t)continue;arr[i]=v;st.push([x+1,y],[x-1,y],[x,y+1],[x,y-1])}}
function placeItem(c){if(!c.in)return false;
  if(U.layer==="prop"&&U.prop){D.props.push({k:U.prop,x:c.x,y:c.y,w:U.pw,h:U.ph,solid:U.solid,note:""});return true}
  if(U.layer==="mark"){D.marks.push({t:U.mark,x:c.x,y:c.y,label:U.label});return true}return false}
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){const a=[...pts.values()];pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),z:U.z,mx:(a[0].x+a[1].x)/2,my:(a[0].y+a[1].y)/2};drag=null;return}
  const c=cell(e);if(U.tool!=="pan"&&!e.shiftKey)showTip(c,e);else $("#tip").classList.remove("show");const pan=U.tool==="pan"||e.button===1||e.button===2||e.shiftKey;
  if(pan){drag={pan:true,sx:e.clientX,sy:e.clientY,ox:U.ox,oy:U.oy};return}
  if(U.tool==="select"){const h=hit(c);U.sel=h;if(h){const it=h.kind==="prop"?D.props[h.i]:D.marks[h.i];drag={move:true,it,dx:c.x-it.x,dy:c.y-it.y,pushed:false}}renderUI();draw();return}
  const itemLayer=(U.layer==="prop"||U.layer==="mark")&&U.tool!=="erase";
  if(itemLayer&&(U.tool==="brush"||U.tool==="rect")){push();if(placeItem(c)){U.sel=null;afterDoc()}return}
  push();
  if(U.tool==="fill"){flood(c);afterDoc();return}
  if(U.tool==="rect"){drag={rect:{x0:c.x,y0:c.y,x1:c.x,y1:c.y}};draw();return}
  drag={paint:true};setCell(c);draw()});
cv.addEventListener("pointermove",e=>{
  if(pts.has(e.pointerId))pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const c=cell(e);$("#hud").textContent=c.in?"pole "+c.x+", "+c.y:"poza mapą";
  if(pinch&&pts.size===2){const a=[...pts.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);zoomAt(pinch.mx,pinch.my,pinch.z*d/pinch.d,true);return}
  if(!drag)return;
  if(drag.pan){U.ox=drag.ox+e.clientX-drag.sx;U.oy=drag.oy+e.clientY-drag.sy;draw();return}
  if(drag.move){if(!drag.pushed){push();drag.pushed=true}drag.it.x=Math.max(0,Math.min(D.w-1,c.x-drag.dx));drag.it.y=Math.max(0,Math.min(D.h-1,c.y-drag.dy));draw();return}
  if(drag.rect){drag.rect.x1=c.x;drag.rect.y1=c.y;draw();return}
  if(drag.paint){setCell(c);draw()}});
function end(e){pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!drag)return;if(drag.rect){fillRect(drag.rect);afterDoc()}else if(drag.paint||drag.move){afterDoc()}drag=null}
cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);cv.addEventListener("contextmenu",e=>e.preventDefault());
function zoomAt(mx,my,nz,abs){const r=cv.getBoundingClientRect();const px=mx-r.left,py=my-r.top;nz=Math.max(3,Math.min(48,nz));const k=nz/U.z;U.ox=px-(px-U.ox)*k;U.oy=py-(py-U.oy)*k;U.z=nz;draw()}
cv.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,U.z*(e.deltaY<0?1.15:1/1.15))},{passive:false});
function center(){const r=cv.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
$("#zin").onclick=()=>zoomAt(...center(),U.z*1.25);$("#zout").onclick=()=>zoomAt(...center(),U.z/1.25);
function fitView(){const r=cv.getBoundingClientRect();U.z=Math.max(3,Math.min(48,Math.floor(Math.min((r.width-20)/D.w,(r.height-20)/D.h))));U.ox=Math.round((r.width-D.w*U.z)/2);U.oy=Math.round((r.height-D.h*U.z)/2);draw()}
$("#fit").onclick=fitView;$("#undo").onclick=undo;$("#redo").onclick=redo;
window.addEventListener("keydown",e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key==="z"){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&e.key==="y"){e.preventDefault();redo()}else if((e.key==="Delete"||e.key==="Backspace")&&U.sel){push();(U.sel.kind==="prop"?D.props:D.marks).splice(U.sel.i,1);U.sel=null;afterDoc()}});
window.addEventListener("resize",resizeCv);

// ---- rozdział, rozmiar ----
chSel.onchange=()=>{const ch=+chSel.value;if(ch===D.ch)return;push();const n=newDoc(ch);n.note=D.note;n.props=[];D=n;U.floor=0;U.prop=null;U.sel=null;afterDoc();fitView()};
$("#resize").onclick=()=>{const w=Math.max(16,Math.min(160,+$("#gw").value||D.w)),h=Math.max(16,Math.min(160,+$("#gh").value||D.h));push();const f=new Uint8Array(w*h),b=new Uint8Array(w*h);for(let y=0;y<Math.min(h,D.h);y++)for(let x=0;x<Math.min(w,D.w);x++){f[y*w+x]=D.floor[y*D.w+x];b[y*w+x]=D.block[y*D.w+x]}D.floor=f;D.block=b;D.w=w;D.h=h;D.props=D.props.filter(p=>p.x<w&&p.y<h);D.marks=D.marks.filter(m=>m.x<w&&m.y<h);afterDoc();fitView()};
function loadPreset(){const P=(typeof PRESETS!=="undefined")&&PRESETS[D.ch];if(!P){toast("Brak zapisanej mapy dla tego rozdziału");return}
  push();const n=newDoc(D.ch);n.w=P.w;n.h=P.h;n.floor=Uint8Array.from(P.floor);n.block=Uint8Array.from(P.block);n.props=P.props.map(p=>({...p}));n.marks=P.marks.map(m=>({...m}));n.note=D.note;D=n;U.sel=null;
  if(P.mini){const im=new Image();im.onload=()=>{U.bg=im;U.bgA=.5;draw()};im.src=P.mini}
  afterDoc();fitView();toast("Wczytano mapę z gry. Radar jest w Plik → Przezroczystość.")}
function doClear(){push();const n=newDoc(D.ch);n.note=D.note;D=n;U.sel=null;afterDoc();toast("Mapa wyczyszczona (Cofnij ją przywróci)")}

// ---- eksport / import ----
const FCH="0123456789abcdefghijklmnopqrstuvwxyz";
function exportText(){
  const rows=(arr,map)=>{const o=[];for(let y=0;y<D.h;y++){let s="";for(let x=0;x<D.w;x++)s+=map(arr[y*D.w+x]);o.push(s)}return o};
  const fl=FLOORS[D.ch];
  const o={format:"nightbrand-mapa-v1",rozdzial:D.ch,nazwa:CHN[D.ch],siatka:[D.w,D.h],
    legenda_podloze:Object.fromEntries(fl.map((f,i)=>[FCH[i],f[0]])),
    legenda_bloki:Object.fromEntries([[".","brak"],...BKEY.map((k,i)=>[String(i+1<10?i+1:"a"),BLOCKS.find(b=>b[0]===k)[1]])]),
    podloze:rows(D.floor,v=>FCH[v]),bloki:rows(D.block,v=>v?(v<10?String(v):"a"):"."),
    rekwizyty:D.props.map(p=>({nazwa:p.k,x:p.x,y:p.y,rozmiar:[p.w,p.h],kolizja:p.solid,...(p.note?{uwaga:p.note}:{})})),
    znaczniki:D.marks.map(m=>({typ:m.t,x:m.x,y:m.y,...(m.label?{nazwa:m.label}:{})})),
    opis:D.note};
  return JSON.stringify(o,null,1)}
function dialog(title,text,ok){$("#dt").textContent=title;$("#dta").value=text;$("#dok").style.display=ok?"":"none";$("#dok").onclick=()=>{ok($("#dta").value)};$("#dlg").showModal()}
$("#dcl").onclick=()=>$("#dlg").close();
function doExport(){const t=exportText();dialog("Eksport mapy: skopiuj i wklej do czatu",t,null);const ta=$("#dta");ta.focus();ta.select();
  if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast("Skopiowano do schowka"),()=>{})}
function doImport(){dialog("Import: wklej tekst eksportu",""  ,txt=>{try{const o=JSON.parse(txt);if(o.format!=="nightbrand-mapa-v1")throw 0;push();const[w,h]=o.siatka;const n=newDoc(o.rozdzial);n.w=w;n.h=h;n.floor=new Uint8Array(w*h);n.block=new Uint8Array(w*h);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){n.floor[y*w+x]=Math.max(0,FCH.indexOf(o.podloze[y][x]));const c=o.bloki[y][x];n.block[y*w+x]=c==="."?0:c==="a"?10:+c}
    n.props=(o.rekwizyty||[]).map(p=>({k:p.nazwa,x:p.x,y:p.y,w:p.rozmiar[0],h:p.rozmiar[1],solid:p.kolizja,note:p.uwaga||""}));n.marks=(o.znaczniki||[]).map(m=>({t:m.typ,x:m.x,y:m.y,label:m.nazwa||""}));n.note=o.opis||"";D=n;U.sel=null;$("#dlg").close();afterDoc();fitView();toast("Wczytano")}catch(e){toast("To nie jest poprawny tekst eksportu")}})}

// ---- start ----
try{const s=localStorage.getItem(SKEY);if(s)load(s)}catch(e){}
if(!D)D=newDoc(1);
renderUI();resizeCv();fitView();
})();
</script>
